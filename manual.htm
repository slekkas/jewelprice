      "Ρυθμίσεις → Αντίγραφα: <strong>☁️ Αντίγραφο τώρα</strong>, <strong>↩️ Επαναφορά</strong>, και εξαγωγή JSON.",
      "<strong>📊 Εξαγωγή αποθέματος (CSV)</strong> για τον λογιστή: κόστος, λιανική, καθαρά γραμμάρια, ανά τύπο.",
      "<strong>📋 Απογραφή</strong> στο τέλος της σεζόν: όλοι σαρώνουν τα κομμάτια και η εφαρμογή δείχνει τι λείπει.",
      "<strong>🕰️ Παλιά αποθέματα</strong> (κουμπί στο Απόθεμα): κομμάτια που κάθονται πολλές σεζόν, με περιθώριο για έκπτωση.",
      "<strong>🔗 Έλεγχος συνδέσεων πωλήσεων</strong> (Ρυθμίσεις): βρίσκει πωλήσεις που το κομμάτι τους δεν σημειώθηκε ως πουλημένο."
    ]},
    { icon:"⚙️", title:"Ρυθμίσεις", items:[
      "<strong>ΦΠΑ</strong> (17% Κάρπαθος), <strong>περιθώριο</strong>, νόμισμα, κλίμακες περιθωρίου ανά βάρος.",
      "<strong>Αυτόματη στρογγυλοποίηση</strong> (βήμα και από πόσα ευρώ).",
      "<strong>Κέρδος %</strong> στο κόστος ή στην πώληση.",
      "<strong>Χρυσός πελάτη:</strong> έκπτωση για ανταλλαγή και για μετρητά. <strong>Απώλεια καθαρισμού %</strong> και <strong>φύρα μετάλλου %</strong>.",
      "Περιθώριο νομισμάτων, χειροκίνητη τιμή χρυσού, εμφάνιση (σκούρο/ανοιχτό)."
    ]},
    { icon:"📱", title:"Εγκατάσταση & offline", items:[
      "Android/Chrome → μενού → «Προσθήκη στην αρχική οθόνη». iPhone/Safari → Κοινοποίηση → «Προσθήκη στην οθόνη Αφετηρίας».",
      "Χωρίς internet μπορείτε να πουλάτε· το «⏳ σε αναμονή» πάνω δείχνει τι περιμένει να σταλεί και φεύγει μόλις έρθει σύνδεση.",
      "Με το σάρωμα «πίσω» στο Android η εφαρμογή γυρίζει στην προηγούμενη καρτέλα· στον Υπολογισμό ζητά δεύτερο σάρωμα για έξοδο.",
      "Μετά από ενημέρωση εμφανίζεται πράσινη μπάρα με τα νέα."
    ]},
    { icon:"🆘", title:"Συμβουλές & προβλήματα", items:[
      "<strong>«Δεν βρέθηκε τιμή χρυσού»:</strong> ξαναδοκιμάζει μόνη της· αν μείνει, βάλτε χειροκίνητη τιμή.",
      "<strong>Δεν σαρώνεται το QR;</strong> Ανάγνωση κειμένου του κωδικού ή φωτογραφία.",
      "<strong>Δεν ανεβαίνει φωτογραφία;</strong> Συγχρονισμός → Cloudinary → «Δοκιμή & Αποθήκευση».",
      "<strong>Χάθηκαν δεδομένα;</strong> Ρυθμίσεις → Αντίγραφα → Επαναφορά.",
      "Πριν από μεγάλες αλλαγές, πατήστε «Αντίγραφο τώρα»."
    ]}
  ],
  en: [
    { icon:"🚀", title:"Getting started", items:[
      "The everyday tabs are at the bottom: <strong>Calc</strong> (pricing), <strong>Stock</strong>, <strong>Sales</strong>, <strong>Clients</strong> and <strong>Desk</strong> (reservations, orders, repairs, gift cards).",
      "Everything else is in the <strong>☰</strong> menu top-right: <strong>Find Jewelry</strong>, <strong>Stats</strong>, <strong>Vendors</strong>, <strong>Team</strong>, <strong>Sync</strong>, <strong>Settings</strong>, <strong>Info</strong> and <strong>Switch User</strong>. Under the ☰ it says who is signed in.",
      "Language (Greek / English) from the flags top-right. Dark or light theme from Settings → Appearance.",
      "Costs, margins, coins and metal are visible only to the <strong>Owner</strong> and <strong>Manager</strong>. An employee sees only what they need to sell.",
      "The app works <strong>offline</strong>: whatever you record waits and is sent as soon as there is a connection (see «Install & offline»)."
    ]},
    { icon:"🧮", title:"Pricing an item", items:[
      "<strong>By scanning:</strong> tap the camera and scan the tag — the price is worked out automatically.",
      "<strong>By code:</strong> type the reference code (e.g. <code>NK0342</code>) or the piece's code.",
      "<strong>Manually:</strong> metal, weight, vendor and labor category. The karat follows the category.",
      "<strong>Discount %</strong> and <strong>rounding</strong> to the exact amount. A scanned piece is rounded to the nearest €5 automatically (from €20 up) — the ✕ beside it brings the cents back. Adjustable in Settings.",
      "<strong>Stones:</strong> open the stones section, add type, carats, quantity. <strong>✨ Estimate</strong> suggests a price — it is never applied on its own.",
      "<strong>Handmade</strong> and a <strong>second metal</strong> (e.g. silver with a gold face) with a toggle.",
      "<strong>Per-item</strong> categories: type the supplier's cost and the retail price you want; the app keeps that price.",
      "Tap the price to show it <strong>full-screen</strong> to the customer, with the photo, metal, weight and discount. Costs never appear there.",
      "If you see red «this is NOT the selling price», the app could not read the piece from stock (usually the internet) — don't quote that figure."
    ]},
    { icon:"📷", title:"Scanning (QR & text)", items:[
      "The camera reads the tag's <strong>QR</strong> on Android, desktop and iPhone (on iPhone it opens in text mode).",
      "<strong>Text scan:</strong> if the QR is faded, tap «Scan code text» and aim at the printed code (e.g. <code>PE0142</code>). The frame turns green once it reads it.",
      "You can also scan a <strong>photo</strong> of a tag from your gallery.",
      "Gift certificates (<code>G-0012</code>) and exchange cards (<code>X-0001</code>) are scanned or typed in the same box. Scanned before a sale, they are held and applied to the sale that follows.",
      "Rarely, if two pieces share a code, the app asks «which one are you holding?» with photos — tap the right one.",
      "The first time, text scan needs internet to download the recognition engine."
    ]},
    { icon:"📡", title:"Gold & silver prices", items:[
      "Live prices in € refresh about every 5 minutes, with a mini chart.",
      "Without internet the <strong>last saved price</strong> is used; the app retries by itself.",
      "If a message says no price has been found for a long time, you can enter a <strong>manual price</strong> in Settings."
    ]},
    { icon:"🏷️", title:"Labels & codes", items:[
      "From Calc tap <strong>Tag</strong>: the piece goes into stock and prints. «Reprint» does not add it again.",
      "Every tag prints the <strong>reference code</strong> (e.g. <code>RG0624</code>) and a QR with the same code. It is unique per piece.",
      "On a Stock card, <strong>🏷️</strong> reprints a piece's tag (a coin's too, e.g. one set in a ring).",
      "If you change a piece's type, its code stays the same as the tag it wears; it changes only when you print a new tag.",
      "The vendor and category letters inside codes are «frozen»: rename a vendor or category and printed tags still scan."
    ]},
    { icon:"📦", title:"Stock", items:[
      "<strong>Search</strong> by description, code or reference code; use commas for several at once (<code>CR0100, CR0200</code>).",
      "<strong>Filters:</strong> type, metal, karat, vendor, stones, colour, gender, price range (retail or cost), date, time in stock, price gain, labor charged, delivery, and status: In stock, Sold, With vendor, Reserved, Grouped, Sets, Consignment, Hidden, No photo.",
      "<strong>Sort</strong>: newest, price, gain, and — with the Sold or Reserved filter on — sale date / reservation date.",
      "<strong>Totals at the top:</strong> pieces, retail, metal value (and cost, if you turn it on in Filters). Tap a card for the breakdown, again for full screen. With the Sold filter on you see the sales, cost and profit of the sold pieces.",
      "<strong>Select:</strong> the Select button, or long-press a card. The bar shows totals (incl. the «initial» cost) and does Share, Group, Set, Reserve, Sell; <strong>⋯</strong> has consignment, return to vendor, metal price I paid and delivery check.",
      "<strong>Piece card:</strong> ➕ to Calc, share, 🔒 reserve, 🎁 gift, 🏷️ tag, sell, edit, delete. Tap the photo to enlarge.",
      "<strong>Edit:</strong> on a piece with a reference-code tag you can correct the weight, vendor and category without a new tag.",
      "<strong>Price gain</strong> (owner only): under the price you see the initial price with the date added and the % since.",
      "<strong>🎁 Gift:</strong> for a piece you give to a customer. It leaves stock, its cost is booked as an expense and it does not count as a sale. From a by-the-gram chain you give grams.",
      "<strong>🙈 Hidden:</strong> not shown in the showroom, stays in stock.",
      "On desktop choose a list / 2 / 3-column view."
    ]},
    { icon:"🚚", title:"New delivery & metal price you paid", items:[
      "When you order, gold has one price; when the goods arrive it may have another. To record the cost at the price you <strong>actually</strong> paid:",
      "<strong>Stock → 📦 New delivery:</strong> pick the supplier and type the price of <strong>pure</strong> gold (or silver) per gram you paid (e.g. 128.40). Press Start.",
      "Enter the pieces as usual (Tag, Add similar, Restock). While it is open, a gold bar at the top shows the supplier, the price and how many pieces went in. Only that supplier's pieces are affected.",
      "The <strong>initial price and the cost</strong> are recorded at the price you paid; the <strong>selling price</strong> still follows today's gold price.",
      "Press <strong>Finish</strong>: you see the pieces, the cost at today's price, the cost at the price you paid, and retail. Optionally type <strong>what the goods cost you before VAT</strong> — no invoice needed. For a mixed payment (cash + invoice) type the total without the VAT.",
      "If it matches you see «✓ Matches». If not, it shows the gap: check the supplier's rates, the weights, or whether a piece is missing.",
      "If you forget to press Finish, the delivery <strong>closes itself</strong> at the end of the day.",
      "Later: Filters → <strong>Delivery</strong> to find the pieces, or select them and ⋯ → <strong>Delivery check</strong>.",
      "Forgot to start a delivery? Select the pieces → ⋯ → <strong>Metal price I paid</strong>. It makes the same correction after the fact.",
      "Pieces priced per item, or with a typed purchase cost, do not change — their cost is already the supplier's figure."
    ]},
    { icon:"🔗", title:"Similar items (groups)", items:[
      "Many similar pieces show as <strong>one card</strong>; each piece stays separate underneath.",
      "<strong>Create:</strong> in Select mode pick the pieces and tap 🔗 Group.",
      "<strong>Add similar:</strong> from Edit → «Add similar items». Quantity, weight (blank = same as the group), colour, gold colour / plating, stone, vendor code, photo. Same piece = same code; a different one = its own code, so its tag identifies it.",
      "From the group card: see the pieces, <strong>Sell several</strong>, <strong>＋ Add more</strong>, <strong>✏️ Edit all</strong> (description, vendor code, handmade, audience, colour) and <strong>Delete all</strong>.",
      "When one piece is left it shows as a normal card; the group re-forms when you add more."
    ]},
    { icon:"🎀", title:"Sets", items:[
      "A set links <strong>different</strong> pieces that go together (necklace, earrings, ring). They are sold separately.",
      "<strong>Create:</strong> Select → pick pieces → 🎀 Set → name. For a piece inside a group: open the group → 🎀 on that piece.",
      "From the set: <strong>➕ Add pieces</strong> by scanning their tags, a set photo, rename, remove, <strong>Add set to cart</strong>.",
      "In the showroom the customer sees the whole set with arrows and can ask about all of it."
    ]},
    { icon:"🤝", title:"Consignment", items:[
      "For goods a supplier sends that you have not paid for.",
      "Select the pieces → ⋯ → <strong>Mark as consignment</strong>. They show with 🤝.",
      "What sold shows as «you owe» the supplier. What didn't sell → ⋯ → <strong>Return to vendor</strong>; the record is kept and next season you press <strong>Back to stock</strong>.",
      "Settings → <strong>🤝 Consignment</strong>: per supplier what you owe, what is still here, and a Settle button."
    ]},
    { icon:"🪙", title:"Coins", items:[
      "<strong>Stock → 🪙 Add Coin</strong>: gold or silver, from the catalogue or with <strong>⚖️ identify by weight</strong>, with quantity and purchase price.",
      "The price is the <strong>metal value</strong> + the markup from Settings. Every coin has a Numista link.",
      "Your own coins are saved under «My coins».",
      "Coins don't show in the list unless you pick the «Coin» type, and never in the showroom.",
      "A coin set in jewellery: add it as «Custom» so it has its own code, and print a tag. Scanning it opens its sale directly.",
      "Before selling, check whether it has <strong>collectable value</strong> above the metal."
    ]},
    { icon:"🧱", title:"Scrap metal", items:[
      "<strong>Stock → 🧱 Add Metal</strong>: pure gold/silver or old jewellery. Each karat has one growing pile.",
      "With a <strong>purchase price below the value</strong>, the gain is booked in today's sales.",
      "<strong>♻️ Kept from a piece:</strong> for metal left over when you shorten your own piece. Better still, from the sale itself: «♻️ Kept metal», so it counts in that sale's profit.",
      "On the pile card: <strong>＋ Add</strong>, <strong>− Remove</strong>, <strong>✏️ Edit</strong>, <strong>📜 Movements</strong> (what came in and went out, with the customer's name and a link to the sale) and <strong>⚗️ Refine to pure</strong> (send to the refiner, enter what you got back, see the loss).",
      "Metal can also go into an order as a <strong>material</strong>, with wastage (see «Orders»).",
      "It doesn't show in the list unless you pick the «Metal» type."
    ]},
    { icon:"⚖️", title:"Customer's gold (exchange or buy)", items:[
      "In Calc, under the prices: <strong>Customer's gold</strong>. Enter karat and weight (＋ for several pieces) and you see two prices: <strong>for exchange</strong> and <strong>for cash</strong>. The deduction % is never shown to the customer.",
      "<strong>Exchange:</strong> press Hold; when the next sale opens, the gold goes in by itself as part of the payment. The sale stays at its full amount and the metal goes into stock.",
      "<strong>Cash:</strong> type what you pay and press Pay — the metal goes into stock per karat.",
      "In the sale you can also press «Gold» and enter the metal there.",
      "The exchange and cash percentages are set in Settings."
    ]},
    { icon:"🏪", title:"Vendors & labor", items:[
      "<strong>☰ → Vendors:</strong> for each vendor, categories with karat and charge: <strong>per gram</strong>, <strong>flat</strong> or <strong>per item</strong>.",
      "A vendor can also have «Other» categories (brass, steel) with a multiplier.",
      "<strong>Wastage %:</strong> if the vendor charges metal above the market price, enter the wastage (for the whole vendor, or per category from the category name).",
      "Each category shows how many pieces it has. Deleting a category or vendor <strong>retires</strong> it; its pieces keep pricing and it can be restored with ↩️.",
      "Change a charge and the app asks whether it is a price increase or a correction, so the gain % stays right."
    ]},
    { icon:"💰", title:"Sales", items:[
      "<strong>Record:</strong> «Sold» on the price bar or the card. Amount, date, seller, customer.",
      "<strong>💵 Cash</strong>: pressed = no receipt (no VAT). <strong>Split payment</strong>: type how much was cash, the rest goes on receipt.",
      "<strong>Owed:</strong> the customer takes the piece and pays later. The sale counts today; the red bar in Sales shows what is owed. «💰 Record a payment» for instalments, «🧾 Statement» for a paper for the customer.",
      "<strong>Gift certificate or credit:</strong> button in the sale or scan the card; the amount comes off and the rest stays on the card.",
      "<strong>Exchange card</strong> for a gift: printed with no price.",
      "<strong>Cart:</strong> several pieces together show as one «🛍 N items» row.",
      "<strong>Correcting:</strong> ✏️ on one sale or on the whole transaction (date, total, customer, seller). «✏️ Payment» for cash / receipt / split / owed.",
      "In the sale you see the list price and the discount, the profit and — if any — the gain on metal you held or took in.",
      "<strong>🖨️ Print</strong> a quote or certificate for a sale already made (the certificate can be printed without the price, for a gift).",
      "<strong>Deleting</strong> a sale puts the exact piece back in stock. For a real return use ↩️ Return."
    ]},
    { icon:"📊", title:"Breakdown & stats", items:[
      "In Sales tap the big total: the period by sale, how it was paid, by activity (jewellery, coins, repairs, metal) and a CSV export.",
      "<strong>Returns</strong> are shown apart from sales, so a return as credit doesn't sink the month.",
      "The margin covers jewellery only; coins don't distort it. Profit % is measured on cost (100 → 200 = 100%) — changeable in Settings.",
      "<strong>☰ → Stats:</strong> per season or month — what sold by type and supplier, price range, weight, day and hour, time on the shelf, best customers."
    ]},
    { icon:"↩️", title:"Returns & credit", items:[
      "Open the sale → <strong>↩️ Return</strong>. The piece goes back into stock.",
      "It is recorded with <strong>today's</strong> date as a negative entry; the original sale is never changed.",
      "<strong>Refund as:</strong> 💳 Credit (default), 💵 Cash, 🏦 Card. You can also refund less.",
      "<strong>Credit</strong> issues a card with a code (<code>G-0012</code>) in the customer's name, valid <strong>2 years</strong>, spent in parts. If they buy something cheaper the rest stays; reprinting it shows a statement of what was bought.",
      "<strong>🔄 Exchange now:</strong> after the return, the credit applies itself to the next sale.",
      "<strong>Exchange card</strong> (<code>X-0001</code>, for gifts): scanning it opens the sale with the piece, so you can press Return.",
      "Whatever was paid with a gift certificate always comes back as credit, never cash.",
      "Mistake? Open the return → <strong>↩️ Undo</strong> (not once the credit has been spent)."
    ]},
    { icon:"🔒", title:"Desk — Reservations", items:[
      "Hold a piece for a customer with a deposit: <strong>RESERVE</strong> on the price bar, in the cart, or 🔒 on the card (and for several from Select).",
      "Enter customer, agreed price, deposit, cash or receipt and «hold until». The pieces leave the showroom and can't be sold by mistake.",
      "In the reservation: list price <strong>today</strong> and the discount, payments, ✏️ edit, print / PDF, <strong>Complete & sell</strong>.",
      "After the date it expires by itself. A cancelled or expired hold can be <strong>↩️ reactivated</strong> with a new date."
    ]},
    { icon:"📦", title:"Desk — Orders & custom pieces", items:[
      "<strong>Order</strong> = a piece that exists and you order it. <strong>Custom</strong> = made from scratch.",
      "With no deposit it is saved as a <strong>quote</strong>: set the price and send it (WhatsApp, SMS, email). When they pay a deposit → «Deposit → order».",
      "When the pieces arrive: <strong>Add pieces</strong> by scanning; they are held for the customer. «Collect & sell» sells them at the agreed price.",
      "<strong>Materials from stock:</strong> a piece, grams of chain, or scrap metal (with wastage) that go into the job. They leave stock when you press «Ready».",
      "<strong>Job cost:</strong> enter the craftsman's cost ahead of time; you see the total cost and the profit (cash / receipt) before the customer comes.",
      "<strong>Collection:</strong> final price, cash/receipt/split, a gift certificate or gold as payment.",
      "If the customer never comes: <strong>«Not collected → into stock»</strong>; the deposit is kept as income and the piece goes into stock at its cost.",
      "A cancelled ticket can be <strong>↩️ reactivated</strong>."
    ]},
    { icon:"🔧", title:"Desk — Repairs", items:[
      "For work on a customer's own piece: photo, description, <strong>cost estimate</strong> (required), date.",
      "Flow: In progress → <strong>Ready</strong> → <strong>Collected</strong> (final price, cost, log as income).",
      "<strong>Notify the customer</strong> by WhatsApp, SMS or email with a ready message.",
      "A claim ticket as PDF for the customer; ✏️ to correct the date or details."
    ]},
    { icon:"🎁", title:"Desk — Gift cards & credit", items:[
      "<strong>Gift certificate:</strong> the customer pays now, someone buys jewellery later. The amount <strong>counts as a sale when it is spent</strong>, not when issued.",
      "Cash = no receipt; card or bank = with receipt. Valid 1 year (changeable).",
      "Print on A4 or as PDF. Spent in parts; a reprint shows what was bought and the balance.",
      "A reminder before it expires (green bell). At expiry: «Extend» or «Book as profit» for the unused balance.",
      "Credits from returns (🎟️) are in the same list. At the top you see how much you owe in jewellery in total."
    ]},
    { icon:"👤", title:"Clients", items:[
      "Each client with phone, email and notes. The total number of clients is shown at the top.",
      "Tap the phone: <strong>Call, WhatsApp, SMS, Email</strong>.",
      "The <strong>history</strong> shows everything: purchases, gifts, orders, repairs, reservations, gift cards.",
      "Sorting (remembers your choice) and a date filter with season buttons.",
      "New clients are added automatically from sales, reservations and repairs."
    ]},
    { icon:"🧾", title:"Quotes & certificates", items:[
      "<strong>Cart:</strong> add pieces and print one A4 quote. Tap a line's price for a discount % or rounding.",
      "The cart survives closing the app (for the same day). From the cart: Sell all, Reserve, or <strong>📦 Order</strong> for catalogue pieces you don't stock.",
      "<strong>Certificate</strong> for one or several pieces; with «Without price» for a gift.",
      "Quote history is searchable and reprintable."
    ]},
    { icon:"🔎", title:"Find Jewelry", items:[
      "<strong>☰ → Find Jewelry:</strong> for a piece that lost its tag.",
      "<strong>By scale:</strong> pick type, metal, karat and type the weight. If nothing comes up, «Search wider» (±0.2 g).",
      "<strong>By photo:</strong> 📷 photograph the piece and AI finds which one it is in your stock. Best for pieces with stones; for plain pieces the scale is more exact.",
      "From the result, print a new tag with 🏷️."
    ]},
    { icon:"📤", title:"Sharing", items:[
      "Select pieces → <strong>Share</strong>: catalogue or order sheet (PDF), with or without prices.",
      "<strong>Promo image</strong> for Instagram/Facebook (no price).",
      "<strong>Send to team:</strong> a message to colleagues with the pieces; «View» opens exactly those."
    ]},
    { icon:"🌐", title:"Online Showroom", items:[
      "A public page where customers browse the stock (photo, type, metal — <strong>no prices</strong>) and send an inquiry.",
      "The <strong>access code</strong> is set in Sync → Showroom code, with a switch to open it to everyone.",
      "Filters for customers: type, metal, stones, colour, gender, sets and a <strong>price range</strong> in bands (never an exact price).",
      "Not shown: hidden 🙈, reserved, sold, coins, metal."
    ]},
    { icon:"👥", title:"Team & roles", items:[
      "<strong>☰ → Team → + Add</strong>: name, role, optional Bonus % and a <strong>PIN</strong>. 📤 sends a personal install link.",
      "Roles: <strong>Owner</strong> (everything), <strong>Manager</strong> (costs, stock, vendors, desk — not settings, sync, backups), <strong>Employee</strong> (selling), <strong>Temporary</strong> (only Calc, Stock, Vendors; no sold pieces, coins or metal).",
      "<strong>☰ → Switch User:</strong> on a shared device, change person (with their PIN, if they have one). Set a «home user» so the device returns to them after a few idle minutes.",
      "⏸ <strong>Deactivate</strong> cuts access without losing that person's sales."
    ]},
    { icon:"☁️", title:"Sync & photos", items:[
      "Everything syncs to the cloud (Firebase) on all devices. Several people can work at the same time without overwriting each other.",
      "<strong>☰ → Sync</strong> (owner): connection, owner PIN, photo keys (Cloudinary), AI key, Telegram, showroom code.",
      "<strong>Recovery Card:</strong> print it once and keep it safe; with it you reconnect if the browser's data is ever cleared.",
      "New phone? Open your personal link again and everything comes back."
    ]},
    { icon:"💾", title:"Backups, export & stocktake", items:[
      "An <strong>automatic backup</strong> of all data every day in the cloud (private).",
      "Settings → Backup: <strong>☁️ Back Up Now</strong>, <strong>↩️ Restore</strong>, and JSON export.",
      "<strong>📊 Export Inventory (CSV)</strong> for the accountant: cost, retail, pure grams, by type.",
      "<strong>📋 Stocktake</strong> at season end: everyone scans the pieces and the app shows what is missing.",
      "<strong>🕰️ Stale Stock</strong> (button in Stock): pieces sitting for several seasons, with the room to discount.",
      "<strong>🔗 Sale Link Check</strong> (Settings): finds sales whose piece was not marked sold."
    ]},
    { icon:"⚙️", title:"Settings", items:[
      "<strong>VAT</strong> (17% Karpathos), <strong>margin</strong>, currency, margin tiers by weight.",
      "<strong>Auto rounding</strong> (step and from how many euros).",
      "<strong>Profit %</strong> on cost or on sale.",
      "<strong>Customer's gold:</strong> deduction for exchange and for cash. <strong>Refining loss %</strong> and <strong>metal wastage %</strong>.",
      "Coin markup, manual gold price, appearance (dark/light)."
    ]},
    { icon:"📱", title:"Install & offline", items:[
      "Android/Chrome → menu → «Add to Home screen». iPhone/Safari → Share → «Add to Home Screen».",
      "You can sell with no internet; «⏳ pending» at the top shows what is waiting to be sent and clears once connected.",
      "On Android the back swipe returns to the previous tab; on Calc it asks for a second swipe to exit.",

    { icon:"🆘", title:"Tips & troubleshooting", items:[

      "<strong>QR won't scan?</strong> Text scan of the code, or a photo.",

};
let lang = localStorage.getItem('jpro_lang') || 'el';
const T = {
  el:{ title:"Οδηγίες Χρήσης", sub:"Πλήρης οδηγός — JewelPrice Pro", back:"← Επιστροφή στην εφαρμογή", expand:"Άνοιγμα όλων", collapse:"Κλείσιμο όλων" },
  en:{ title:"User Manual", sub:"Complete guide — JewelPrice Pro", back:"← Back to the app", expand:"Expand all", collapse:"Collapse all" }
};
function render(){
  document.documentElement.lang = lang;
  const t = T[lang];
  document.getElementById('pageTitle').textContent = t.title;
  document.getElementById('pageSub').textContent = t.sub;
  document.getElementById('backLink').textContent = t.back;
  document.getElementById('btnExpand').textContent = t.expand;
  document.getElementById('btnCollapse').textContent = t.collapse;
  document.getElementById('btnEl').classList.toggle('active', lang==='el');
  document.getElementById('btnEn').classList.toggle('active', lang==='en');
  const list = document.getElementById('list');
  list.innerHTML = '';
  MANUAL[lang].forEach((s, i) => {
    const sec = document.createElement('div');
    sec.className = 'sec' + (i===0 ? ' open' : '');
    const head = document.createElement('div');
    head.className = 'sec-head';
    head.onclick = () => sec.classList.toggle('open');
    const title = document.createElement('div');
    title.className = 'sec-title';
    title.textContent = s.icon + '  ' + s.title;
    const chev = document.createElement('span');
    chev.className = 'sec-chev'; chev.textContent = '▼';
    head.appendChild(title); head.appendChild(chev);
    const body = document.createElement('div');
    body.className = 'sec-body';
    const ul = document.createElement('ul');
    s.items.forEach(it => { const li = document.createElement('li'); li.innerHTML = it; ul.appendChild(li); });
    body.appendChild(ul);
    sec.appendChild(head); sec.appendChild(body);
    list.appendChild(sec);
  });
}
function setAll(open){ document.querySelectorAll('.sec').forEach(s => s.classList.toggle('open', open)); }
function setLang(l){ lang=l; try{localStorage.setItem('jpro_lang',l);}catch(e){} render(); }
render();
</script>
